<style>

button,select,input{font:inherit}button{cursor:pointer}.shell{max-width:1500px;margin:0 auto;padding:26px 28px 54px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:750}.hero h1{font-family:Georgia,serif;font-size:clamp(30px,4vw,48px);letter-spacing:.035em;margin:6px 0 3px;color:#f5ead5}.hero p{color:var(--muted);margin:0}.hero-mark{font-size:46px;opacity:.88}.topline{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:18px 0 22px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.tab{background:#172630;border:1px solid var(--line);color:var(--muted);padding:10px 16px;border-radius:9px;font-weight:700}.tab.active{background:#2b3940;color:#fff1d5;border-color:#a8874e;box-shadow:inset 0 -2px var(--gold)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.source-note{font-size:12px;color:var(--muted)}.reset{border:1px solid #6a5b3e;color:#f0dba8;background:#2d2a22;padding:8px 13px;border-radius:8px;font-weight:700}.reset:hover{background:#403927}
.panel{background:linear-gradient(145deg,rgba(24,39,50,.98),rgba(17,29,38,.98));border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow);margin-bottom:17px}.panel h2{font-family:Georgia,serif;font-size:20px;margin:0 0 5px}.panel-sub{font-size:12px;color:var(--muted);margin:0 0 13px}.filters{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px}.filter label{display:block;font-size:12px;color:#c4d0d7;font-weight:700;margin-bottom:6px}.filter select{width:100%;min-height:102px;background:#0e1921;color:var(--text);border:1px solid #354b58;border-radius:8px;padding:7px;font-size:12px}.filter select:focus{outline:2px solid #947a4a;outline-offset:1px}.hint{font-size:10px;color:#8fa0ac;margin-top:4px}.filter-actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}.small-btn{background:#21333f;color:#d8e2e7;border:1px solid #405562;border-radius:7px;padding:6px 10px;font-size:11px}.unknown-toggle{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px}.unknown-toggle input{accent-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.kpi{background:linear-gradient(150deg,#1d303b,#14232d);border:1px solid var(--line);border-radius:12px;padding:15px 16px;min-height:103px}.kpi .label{font-size:11px;color:var(--muted);font-weight:700}.kpi .value{font-family:Georgia,serif;font-size:29px;color:#fff1d1;margin-top:7px;line-height:1.12}.kpi .detail{font-size:10px;color:#8fa3ae;margin-top:5px}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.chart-card{background:#111f29;border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0;overflow:hidden}.chart-card.wide{grid-column:1/-1}.chart-title{font-size:13px;font-weight:800;color:#e9e5dc;margin:0 0 2px}.chart-sub{font-size:10px;color:var(--muted);margin:0 0 11px}.chart{width:100%;min-height:210px;display:flex;align-items:center;justify-content:center}.chart svg{width:100%;height:auto;max-height:300px;overflow:visible}.empty{font-size:12px;color:var(--muted);padding:50px 10px;text-align:center}.legend{display:flex;flex-wrap:wrap;gap:8px 13px;font-size:10px;color:var(--muted);margin-top:6px}.legend span{display:inline-flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.table-wrap{overflow:auto;max-height:390px;border:1px solid #2a3d49;border-radius:8px}.data-table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}.data-table th{position:sticky;top:0;background:#233541;color:#f0dfb9;text-align:left;padding:9px 10px;z-index:1}.data-table td{padding:8px 10px;border-top:1px solid #253844;color:#d8e0e4}.data-table tr:nth-child(even) td{background:#172732}.download{background:#283a45;color:#f5e8ca;border:1px solid #526570;border-radius:7px;padding:7px 11px;font-size:11px;font-weight:700;margin-top:11px}.download:hover{background:#344b59}.method-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.method-card{background:#111f29;border:1px solid var(--line);padding:16px;border-radius:10px}.method-card h3{font-family:Georgia,serif;margin:0 0 7px;color:#f0dcae;font-size:16px}.method-card p,.method-card li{color:#b7c4cb;font-size:12px}.method-card ul{padding-left:18px;margin:8px 0}.status{border-left:3px solid var(--teal);padding:9px 12px;background:#142a2c;border-radius:0 7px 7px 0;color:#c7e4de;font-size:12px;margin-top:12px}.footer{text-align:center;color:#728590;font-size:10px;margin-top:30px}.error{color:#ffc6b8;background:#3a201c;border:1px solid #70473f;border-radius:8px;padding:13px;font-size:12px}
@media(max-width:950px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-grid{grid-template-columns:1fr}.chart-card.wide{grid-column:auto}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-mark{display:none}}

<script id="dataset" type="application/json">__DATA_JSON__</script>
<script>
(function(){
'use strict';
const raw=JSON.parse(document.getElementById('dataset').textContent);
const $=id=>document.getElementById(id);
const COLORS=['#d8b46a','#69c6b5','#e28e7d','#a69adc','#77a8d5','#83bb83','#d58bb2','#c7a98b','#8eb7bd','#d0ce83'];
const num=v=>{if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(v);return Number.isFinite(n)?n:null};
const txt=(v,missing='Не указано')=>v===null||v===undefined||String(v).trim()===''?missing:String(v).trim();
const normHouse=v=>{let s=txt(v);if(s==='None'||s==='nan'||s==='NaN')return 'Не указано';return s.replace(/^House\s+/i,'').trim()||'Не указано'};
const deaths=raw.deaths.map(r=>({...r,year:num(r['Death Year']),book:num(r['Book of Death']),chapter:num(r['Death Chapter']),intro:num(r['Book Intro Chapter']),gender:num(r.Gender),noble:num(r.Nobility),house:normHouse(r.Allegiances)}));
const predictions=raw.predictions.map(r=>({...r,actual:num(r.actual),pred:num(r.pred),alive:num(r.alive),isAlive:num(r.isAlive),age:num(r.age),male:num(r.male),noble:num(r.isNoble),popularity:num(r.popularity),deadRelations:num(r.numDeadRelations),house:normHouse(r.house),culture:txt(r.culture)}));
const battles=raw.battles.map(r=>({...r,year:num(r.year),number:num(r.battle_number),majorDeath:num(r.major_death),majorCapture:num(r.major_capture),attackerSize:num(r.attacker_size),defenderSize:num(r.defender_size),summer:num(r.summer),region:txt(r.region),type:txt(r.battle_type),attacker:txt(r.attacker_1),outcome:txt(r.attacker_outcome),location:txt(r.location)}));
let current='deaths';
const state={deaths:{year:[],house:[],book:[],gender:[],noble:[],unknown:true},predictions:{actual:[],pred:[],house:[],culture:[],male:[],noble:[]},battles:{year:[],region:[],type:[],attacker:[],outcome:[],location:[]}};
const fmt=n=>Number(n||0).toLocaleString('ru-RU');
const pct=(a,b)=>b?`${(a/b*100).toFixed(1).replace('.',',')}%`:'—';
const uniq=(rows,fn)=>[...new Set(rows.map(fn).filter(v=>v!==null&&v!==undefined&&String(v)!==''))].sort((a,b)=>String(a).localeCompare(String(b),'ru',{numeric:true}));
const countBy=(rows,fn)=>{const m=new Map();rows.forEach(r=>{const k=fn(r);m.set(k,(m.get(k)||0)+1)});return [...m.entries()].sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0]),'ru'))};
const sum=(rows,fn)=>rows.reduce((s,r)=>s+(num(fn(r))||0),0);
function optionsHtml(values,selected){return values.map(v=>`<option value="${esc(String(v))}" ${selected.includes(String(v))?'selected':''}>${esc(String(v))}</option>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function multi(id,label,values,hint='Выберите одно или несколько значений. Пустой список = все значения.'){const vs=values.map(String);const selected=state[current][id].length?state[current][id].filter(v=>vs.includes(v)):vs;state[current][id]=selected;return `<div class="filter"><label for="f-${id}">${label}</label><select id="f-${id}" multiple size="4">${optionsHtml(vs,selected)}</select><div class="hint">${hint}</div></div>`}
function singleCheck(id,label,checked){return `<label class="unknown-toggle"><input type="checkbox" id="f-${id}" ${checked?'checked':''}> ${label}</label>`}
function getSel(id){const el=$('f-'+id);if(!el)return [];return [...el.selectedOptions].map(o=>o.value)}
function attachFilters(ids,tab){ids.forEach(id=>{const el=$('f-'+id);if(el)el.addEventListener('change',()=>{state[tab][id]=[...el.selectedOptions].map(o=>o.value);render()})});const u=$('f-unknown');if(u)u.addEventListener('change',()=>{state[tab].unknown=u.checked;render()})}
function baseSelect(rowValue,selected){return !selected||!selected.length||selected.includes(String(rowValue))}
function inSelection(rowValue, selected){return !selected || !selected.length || selected.includes(String(rowValue))}
function filterDeaths(){const s=state.deaths;return deaths.filter(r=>(s.unknown||r.year!==null)&&baseSelect(r.year===null?'Без года':r.year,s.year)&&baseSelect(r.house,s.house)&&baseSelect(r.book===null?'Без книги':r.book,s.book)&&baseSelect(r.gender===null?'Нет данных':r.gender,s.gender)&&baseSelect(r.noble===null?'Нет данных':r.noble,s.noble))}
function filterPred(){const s=state.predictions;return predictions.filter(r=>baseSelect(r.actual===null?'Нет данных':r.actual,s.actual)&&baseSelect(r.pred===null?'Нет данных':r.pred,s.pred)&&baseSelect(r.house,s.house)&&baseSelect(r.culture,s.culture)&&baseSelect(r.male===null?'Нет данных':r.male,s.male)&&baseSelect(r.noble===null?'Нет данных':r.noble,s.noble))}
function filterBattles(){const s=state.battles;return battles.filter(r=>baseSelect(r.year===null?'Без года':r.year,s.year)&&baseSelect(r.region,s.region)&&baseSelect(r.type,s.type)&&baseSelect(r.attacker,s.attacker)&&baseSelect(r.outcome==='win'?'Победа':r.outcome==='loss'?'Поражение':'Неизвестно',s.outcome)&&baseSelect(r.location,s.location))}
function kpis(items){return `<section class="kpis">${items.map(x=>`<div class="kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="detail">${x[2]||''}</div></div>`).join('')}</section>`}
function filterPanel(title,subtitle,body,resetText){return `<section class="panel"><h2>${title}</h2><p class="panel-sub">${subtitle}</p><div class="filters">${body}</div><div class="filter-actions">${resetText||''}<span class="hint">Для множественного выбора используйте Ctrl (Windows) или Shift.</span></div></section>`}
function chartCard(title,subtitle,content,wide=false){return `<section class="chart-card ${wide?'wide':''}"><div class="chart-title">${title}</div><div class="chart-sub">${subtitle||''}</div><div class="chart">${content}</div></section>`}
function noData(msg='Нет записей для выбранных фильтров'){return `<div class="empty">${msg}</div>`}
function barSvg(entries,opts={}){if(!entries.length)return noData();const horizontal=opts.horizontal!==false;const W=opts.width||620,H=opts.height||240,pad=horizontal?{l:145,r:30,t:10,b:10}:{l:42,r:12,t:15,b:50};const max=Math.max(1,...entries.map(x=>x[1]));let innerW=W-pad.l-pad.r,innerH=H-pad.t-pad.b;let body='';if(horizontal){let rowH=innerH/entries.length;entries.forEach((e,i)=>{let y=pad.t+i*rowH+rowH*.17,w=e[1]/max*(innerW-52),barH=rowH*.63;body+=`<text x="${pad.l-9}" y="${y+barH*.75}" text-anchor="end" font-size="10" fill="#aebcc4">${esc(short(e[0],23))}</text><rect x="${pad.l}" y="${y}" width="${Math.max(1,w)}" height="${barH}" rx="4" fill="${COLORS[i%COLORS.length]}" opacity=".9"/><text x="${pad.l+w+6}" y="${y+barH*.75}" font-size="10" fill="#e8e4dc">${fmt(e[1])}</text>`})}else{let slot=innerW/entries.length,bw=slot*.55;entries.forEach((e,i)=>{let h=e[1]/max*(innerH-30),x=pad.l+i*slot+(slot-bw)/2,y=pad.t+innerH-h;body+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${COLORS[i%COLORS.length]}"/><text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="10" fill="#e7e0d3">${fmt(e[1])}</text><text x="${x+bw/2}" y="${H-16}" text-anchor="middle" font-size="9" fill="#aebcc4">${esc(short(e[0],11))}</text>`})}return `<svg viewBox="0 0 ${W} ${H}" role="img">${body}</svg>`}
function donutSvg(entries){if(!entries.length)return noData();const total=entries.reduce((s,x)=>s+x[1],0)||1;const r=64,c=2*Math.PI*r;let offset=0;let circles='';entries.forEach((e,i)=>{let len=e[1]/total*c;circles+=`<circle cx="110" cy="105" r="${r}" fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="25" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 110 105)"/>`;offset+=len});let legend=entries.map((e,i)=>`<div><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>${esc(short(e[0],28))}: ${fmt(e[1])}</div>`).join('');return `<div style="display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;width:100%"><svg viewBox="0 0 220 210" style="max-width:220px"><circle cx="110" cy="105" r="64" fill="none" stroke="#263b47" stroke-width="25"/>${circles}<text x="110" y="101" text-anchor="middle" font-size="20" fill="#f3e8cd" font-weight="700">${fmt(total)}</text><text x="110" y="119" text-anchor="middle" font-size="9" fill="#aebcc4">всего</text></svg><div style="display:grid;gap:8px;font-size:10px;color:#aebcc4;min-width:135px">${legend}</div></div>`}
function lineSvg(entries){if(!entries.length)return noData();const W=620,H=230,p={l:42,r:15,t:18,b:42},iw=W-p.l-p.r,ih=H-p.t-p.b,max=Math.max(1,...entries.map(e=>e[1]));const pts=entries.map((e,i)=>[p.l+(entries.length===1?iw/2:i*iw/(entries.length-1)),p.t+ih-(e[1]/max)*ih]);let path=pts.map((pt,i)=>(i?'L':'M')+pt[0]+','+pt[1]).join(' ');let dots=pts.map((pt,i)=>`<circle cx="${pt[0]}" cy="${pt[1]}" r="4" fill="${COLORS[1]}"/><text x="${pt[0]}" y="${pt[1]-9}" text-anchor="middle" font-size="10" fill="#eee4d0">${fmt(entries[i][1])}</text><text x="${pt[0]}" y="${H-15}" text-anchor="middle" font-size="9" fill="#aebcc4">${esc(short(entries[i][0],12))}</text>`).join('');return `<svg viewBox="0 0 ${W} ${H}"><path d="${path}" fill="none" stroke="${COLORS[1]}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`}
function heatSvg(rows,cols,valueFn){if(!rows.length||!cols.length)return noData();const cellW=44,cellH=26,left=130,top=27,W=left+cols.length*cellW+10,H=top+rows.length*cellH+10;let vals=rows.flatMap(r=>cols.map(c=>valueFn(r,c))),max=Math.max(1,...vals);let body='';cols.forEach((c,i)=>body+=`<text x="${left+i*cellW+cellW/2}" y="18" font-size="9" fill="#aebcc4" text-anchor="middle">${esc(short(c,7))}</text>`);rows.forEach((r,i)=>{body+=`<text x="${left-8}" y="${top+i*cellH+17}" text-anchor="end" font-size="9" fill="#bdc8ce">${esc(short(r,20))}</text>`;cols.forEach((c,j)=>{const v=valueFn(r,c),opacity=.12+.88*v/max;body+=`<rect x="${left+j*cellW+2}" y="${top+i*cellH+2}" width="${cellW-4}" height="${cellH-4}" rx="3" fill="${COLORS[1]}" opacity="${v?opacity:0.08}"/><text x="${left+j*cellW+cellW/2}" y="${top+i*cellH+17}" text-anchor="middle" font-size="9" fill="#eff4f1">${v||''}</text>`})});return `<svg viewBox="0 0 ${W} ${H}" style="max-height:360px">${body}</svg>`}
function scatterSvg(rows,xFn,yFn,xLabel,yLabel){const pts=rows.map(r=>[num(xFn(r)),num(yFn(r))]).filter(p=>p[0]!==null&&p[1]!==null);if(!pts.length)return noData('Нет достаточного количества числовых наблюдений');const W=620,H=230,p={l:42,r:15,t:15,b:40},xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);const X=x=>p.l+(x-xmin)/(xmax-xmin||1)*(W-p.l-p.r),Y=y=>H-p.b-(y-ymin)/(ymax-ymin||1)*(H-p.t-p.b);let dots=pts.map((pt,i)=>`<circle cx="${X(pt[0])}" cy="${Y(pt[1])}" r="4" fill="${COLORS[i%COLORS.length]}" opacity=".78"><title>${xLabel}: ${pt[0]}, ${yLabel}: ${pt[1]}</title></circle>`).join('');return `<svg viewBox="0 0 ${W} ${H}"><path d="M${p.l},${p.t} V${H-p.b} H${W-p.r}" stroke="#627783" fill="none"/><text x="${W/2}" y="${H-5}" text-anchor="middle" fill="#aebcc4" font-size="10">${esc(xLabel)}</text><text x="12" y="${H/2}" transform="rotate(-90 12 ${H/2})" fill="#aebcc4" font-size="10" text-anchor="middle">${esc(yLabel)}</text>${dots}</svg>`}
function histogramSvg(rows,valueFn){const vals=rows.map(r=>num(valueFn(r))).filter(v=>v!==null);if(!vals.length)return noData();const bins=10,min=Math.min(...vals),max=Math.max(...vals),counts=Array(bins).fill(0);vals.forEach(v=>{let i=max===min?0:Math.min(bins-1,Math.floor((v-min)/(max-min)*bins));counts[i]++});const labels=counts.map((_,i)=>max===min?String(min):(min+(max-min)*i/bins).toFixed(2));return barSvg(counts.map((v,i)=>[labels[i],v]),{horizontal:false,height:220})}
function short(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}
function tableHtml(rows,columns){if(!rows.length)return noData();return `<div class="table-wrap"><table class="data-table"><thead><tr>${columns.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,250).map(r=>`<tr>${columns.map(c=>`<td>${esc(c[1](r)??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="hint">Показано ${Math.min(rows.length,250)} из ${fmt(rows.length)} строк.</div>`}
function downloadCsv(rows,columns,filename){const escCsv=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[columns.map(c=>escCsv(c[0])).join(';'),...rows.map(r=>columns.map(c=>escCsv(c[1](r))).join(';'))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=filename;a.click();URL.revokeObjectURL(a.href)}
